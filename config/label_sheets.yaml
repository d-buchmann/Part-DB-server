# Built-in label sheets (pre-cut labels on A4/Letter/... sheets) that can be selected in a label profile.
#
# Grouped by brand, keyed by the product code. The profile stores "<brand>/<code>", so don't rename existing keys.
# The text shown in the select is generated from the values (e.g. "L7160 / J8160 – 21 × 63.5 × 38.1 mm (A4)").
#
#   <code>:
#     also: [...]              # optional: other codes of the same brand with the very same layout
#     page: A4                 # A4, A5, Letter, Legal, or [width, height]
#     unit: mm                 # optional: mm (default) or in, all lengths of this entry are in this unit
#     label: [width, height]   # size of one label
#     columns: 3               # labels per row
#     rows: 7                  # labels per column
#     top: 15.15               # top page edge to the top edge of the first label row
#     left: 7.21               # left page edge to the left edge of the first label column
#     pitch_x: 66.04           # left edge of a label to the left edge of the next one (label width + gap)
#     pitch_y: 38.1            # top edge of a label to the top edge of the next one (label height + gap)
#
# Only add values from the manufacturer's own data (product page, template, die-cut drawing) and put the
# source in a comment above the entry. tests/Services/LabelSystem/LabelSheetProviderTest checks that every
# sheet is complete, fits on its page and that no labels overlap.

