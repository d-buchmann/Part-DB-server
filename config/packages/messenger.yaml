framework:
    messenger:
        # Doctrine transport — uses the messenger_messages table.
        # Run `php bin/console messenger:setup-transports` once to create the table.
        transports:
            async:
                dsn: 'doctrine://default'
        routing:
            # Route the WLED off-command through the async (Doctrine) transport
            # so it is executed by the Messenger worker after the configured delay.
            'App\Message\WLED\WledOffMessage': async
